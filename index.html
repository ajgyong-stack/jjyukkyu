<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>iPhone</title>
<noscript><style>#frame{display:none}.stage::after{content:"JavaScript가 꺼진 미리보기에서는 실행되지 않아요. Safari나 GitHub Pages 주소로 열어 주세요.";position:absolute;left:28px;right:28px;top:42%;color:#fff;font-size:17px;line-height:1.6;text-align:center}</style></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;border:none;background:none;color:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text;outline:none;border:none;background:none;color:inherit;font-size:inherit}
.stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2b2b33,#0b0b0d 70%);overflow:hidden}

/* ===== 기기 프레임 (PC) / 전체화면 (모바일) ===== */
#frame{position:absolute;left:50%;top:50%;width:417px;height:876px;padding:12px;border-radius:68px;background:#151518;box-shadow:0 0 0 2px #3b3b42,0 0 0 6px #0c0c0e,0 40px 100px rgba(0,0,0,.7);transform-origin:center}
.btn{position:absolute;width:4px;background:#2d2d33;border-radius:2px}
.btn.a{left:-7px;top:130px;height:30px}.btn.b{left:-7px;top:190px;height:58px}.btn.c{left:-7px;top:262px;height:58px}
.btn.p{right:-7px;top:220px;height:90px;cursor:pointer}
.mobile #frame{left:0;top:0;padding:0;border-radius:0;box-shadow:none;transform-origin:0 0}
.mobile .btn,.mobile #island{display:none}
.mobile.sa #sb{display:none}
#screen{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;color:#000;
  --bg:#fff;--bg2:#f2f2f7;--card:#fff;--fg:#000;--sub:#8e8e93;--line:rgba(60,60,67,.2);--blue:#007aff;--fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.94);--kbg:#b2c7d9}
#screen[data-theme=dark]{--bg:#000;--bg2:#000;--card:#1c1c1e;--fg:#fff;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.28);--bar:rgba(29,29,31,.94);--kbg:#1d2733}
.mobile #screen{border-radius:0}
#island{position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:35px;border-radius:20px;background:#000;z-index:95}
#dim{position:absolute;inset:0;background:#000;opacity:0;z-index:200;pointer-events:none}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);background:rgba(40,40,40,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:150;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== 상태바 / 홈 인디케이터 ===== */
#sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font-weight:600;font-size:17px;color:#fff;z-index:90;pointer-events:none;transition:color .25s}
#sb.k{color:#000}
.sbl{display:flex;align-items:center;gap:5px}
.sbr{display:flex;gap:5px;align-items:center;font-size:14px;font-weight:600}
.sbr svg{fill:currentColor}
.bt{width:26px;height:12.5px;border:1px solid currentColor;border-radius:4px;padding:1.2px;position:relative;opacity:.95}
.bt i{display:block;height:100%;width:78%;background:currentColor;border-radius:2px}
.bt::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0;opacity:.6}
#hb{position:absolute;bottom:0;left:0;right:0;height:34px;z-index:92;cursor:pointer;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;touch-action:none}
#hb i{width:138px;height:5px;border-radius:3px;background:#fff;transition:background .25s}
#hb.k i{background:#000}

/* ===== 홈 화면 ===== */
#home{position:absolute;inset:0;z-index:1;transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .4s}
#home.away{transform:scale(.92);filter:blur(6px)}
.wp{position:absolute;inset:0;background:
  radial-gradient(120% 40% at 50% 100%,rgba(122,104,78,.85),transparent 70%),
  radial-gradient(90% 30% at 20% 40%,rgba(255,255,255,.45),transparent 70%),
  radial-gradient(80% 30% at 85% 62%,rgba(255,255,255,.25),transparent 70%),
  linear-gradient(#d6d5d2,#dcd9d6 35%,#bdb8b3 62%,#9b948c 85%,#7f7364)}
#pages{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:393px;scroll-snap-align:start;padding-top:89px}
.grid{display:grid;grid-template-columns:repeat(4,90px);justify-content:center;row-gap:18px}
.ic{width:90px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.ic .i{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#fff;transition:transform .12s;font-size:26px;font-weight:700}
.ic:active .i{transform:scale(.9)}
.ic .i.f{background:rgba(246,246,246,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);grid-template-columns:repeat(3,15px);gap:3.5px;place-content:center}
.m{width:15px;height:15px;border-radius:3.5px;display:grid;place-items:center;font-size:8px;font-weight:700;overflow:hidden}
.ic span{font-size:11.5px;color:#fff;text-shadow:0 0 5px rgba(0,0,0,.25);white-space:nowrap;height:14px;line-height:14px}
.bd{position:absolute;top:-11px;left:calc(50% + 21px);transform:translateX(-50%);min-width:24px;height:24px;border-radius:12px;background:#ff3b30;color:#fff;font-size:15px;font-weight:500;display:grid;place-items:center;padding:0 7px;z-index:2;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.dots{position:absolute;bottom:182px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}.dots i.on{background:#fff}
.spot{position:absolute;left:50%;bottom:135px;transform:translateX(-50%);height:32px;padding:0 16px;border-radius:16px;background:rgba(110,110,110,.38);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:15px;display:flex;align-items:center;gap:6px}
.dock{position:absolute;left:18px;right:18px;bottom:16px;height:96px;border-radius:38px;background:rgba(255,255,255,.34);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:grid;grid-template-columns:repeat(4,1fr);place-items:center;padding:0 4px}
.dock .ic span{display:none}.dock .ic{width:80px}
.fo{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.25);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;flex-direction:column;align-items:center;padding-top:150px;animation:fin .25s}
@keyframes fin{from{opacity:0;transform:scale(.9)}}
.fn{color:#fff;font-size:26px;font-weight:600;margin-bottom:26px}
.fp{width:340px;padding:22px 8px;border-radius:38px;background:rgba(255,255,255,.28);display:grid;grid-template-columns:repeat(3,1fr);row-gap:18px;justify-items:center}

/* ===== 잠금화면 ===== */
#lock{position:absolute;inset:0;z-index:80;color:#fff;overflow:hidden;transition:transform .55s cubic-bezier(.3,.8,.2,1)}
#lock.unlocked{transform:translateY(-102%);pointer-events:none}
#lbg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
#lock .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28),transparent 28%,transparent 58%,rgba(0,0,0,.5))}
#lmain{position:absolute;inset:0;cursor:pointer;touch-action:none}
.ldate{position:absolute;top:70px;width:100%;text-align:center;font-size:20px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.ltime{position:absolute;top:92px;width:100%;text-align:center;font-size:96px;font-weight:600;letter-spacing:-1px;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.noti{position:absolute;left:12px;right:12px;bottom:158px;border-radius:22px;background:rgba(70,70,70,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:12px 14px;display:flex;gap:11px;align-items:center}
.noti .ni{width:38px;height:38px;border-radius:9px;background:#fee500;display:grid;place-items:center;flex:none}
.noti b{font-size:15px;display:block}.noti p{font-size:14px;opacity:.92;margin-top:1px}.noti small{margin-left:auto;font-size:12px;opacity:.7;align-self:flex-start}
.lkb{position:absolute;bottom:50px;width:50px;height:50px;border-radius:50%;background:rgba(30,30,30,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;font-size:22px}
.lkb.on{background:#fff;color:#000}
.lhint{position:absolute;bottom:22px;width:100%;text-align:center;font-size:12px;opacity:.6;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.2}}
#pass{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.32);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;padding-top:104px}
#pass.show{opacity:1;pointer-events:auto}
#ptitle{font-size:19px;font-weight:500;margin-bottom:26px}
.noti{display:none!important}
.nbn{position:absolute;left:8px;right:8px;top:50px;z-index:120;border-radius:26px;background:rgba(235,235,240,.88);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);padding:12px 14px;display:flex;gap:11px;align-items:center;color:#000;box-shadow:0 8px 30px rgba(0,0,0,.28);transform:translateY(-140px);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1.05),opacity .3s;cursor:pointer;touch-action:none}
.nbn.show{transform:none;opacity:1}
#screen[data-theme=dark] .nbn{background:rgba(50,50,54,.88);color:#fff}
.nbn .ni2{width:38px;height:38px;border-radius:9px;background:#fee500;display:grid;place-items:center;flex:none}
.nbn .nt2{flex:1;min-width:0}
.nbn .nt2 b{font-size:15px;font-weight:600;display:block}
.nbn .nt2 p{font-size:14px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbn small{font-size:12px;opacity:.6;align-self:flex-start}
.pdots{display:flex;gap:22px;height:14px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}.pdots i.f{background:#fff}
.pdots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.pk{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px}
.pk button{height:76px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:34px;font-weight:300;line-height:1;transition:background .1s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pk button:active{background:rgba(255,255,255,.6)}
.pk button small{font-size:9.5px;letter-spacing:2px;font-weight:600;margin-top:2px;height:10px}
.pk .gap{visibility:hidden}
.pa{position:absolute;bottom:52px;left:56px;right:56px;display:flex;justify-content:space-between;font-size:17px;color:#fff}

/* ===== 앱 공통 ===== */
#appLayer{position:absolute;inset:0;z-index:30;pointer-events:none}
.app{position:absolute;inset:0;pointer-events:auto;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:scale(.16);border-radius:46px;transition:transform .42s cubic-bezier(.2,.85,.25,1),opacity .25s,border-radius .42s}
.app.open{opacity:1;transform:none;border-radius:0}
.top{height:54px;flex:none}
.nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;font-size:17px}
.nav .ni{display:flex;gap:18px;align-items:center}
.nav button{display:flex;align-items:center;gap:2px}
.blue{color:var(--blue)}.b{font-weight:600}.red{color:#ff3b30}
.lt{font-size:34px;font-weight:700;padding:0 20px 6px;letter-spacing:.2px;flex:none}
.sc{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:40px}
.sc::-webkit-scrollbar{display:none}
.sub{color:var(--sub);font-size:15px}
.tabs{flex:none;height:83px;display:flex;justify-content:space-around;padding:7px 4px 0;background:var(--bar);border-top:.5px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:10px;cursor:pointer}
.tab.on{color:var(--blue)}
.tab .gl{font-size:22px;height:26px;line-height:26px}
.grp{background:var(--card);border-radius:12px;margin:0 16px 20px;overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;font-size:17px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.grp>.rw:last-child{border-bottom:none}
.rw.col{flex-direction:column;align-items:flex-start;gap:2px;padding:9px 16px}
.rw .g{flex:1}
.rw input[type=text],.rw input:not([type]),.rw input[type=tel]{flex:1;min-width:0}
.si{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.chv{color:var(--sub);opacity:.6}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(#a8aab5,#7b7d89);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:500;flex:none}
.av.s{width:36px;height:36px;font-size:15px}
.search{margin:4px 16px 12px;height:36px;border-radius:10px;background:var(--fill);color:var(--sub);display:flex;align-items:center;padding:0 10px;gap:6px;font-size:17px}
.lst{padding-left:20px}
.lr{display:flex;align-items:center;gap:8px;padding:0 20px 0 0;min-height:54px;border-bottom:.5px solid var(--line);cursor:pointer}
.lr .nm{flex:1;font-size:17px}
.lr.tall{gap:12px;padding:8px 16px 8px 0;align-items:flex-start}
.lr.tall .g{flex:1;min-width:0}
.rt{display:flex;justify-content:space-between;font-size:17px}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg b{padding:5px 16px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer}
.seg b.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sech{background:var(--fill);padding:2px 20px;font-size:14px;font-weight:600;color:var(--sub);margin-left:-20px;padding-left:20px}

/* 전화 */
.padwrap{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding-top:18px}
.numd{font-size:36px;min-height:44px;font-weight:400;letter-spacing:.5px}
.addn{color:var(--blue);font-size:16px;height:24px;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:14px 24px}
.k{height:78px;border-radius:50%;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:400;line-height:1;transition:background .1s;-webkit-touch-callout:none}
.k:active{background:rgba(120,120,128,.4)}
.k small{font-size:9.5px;letter-spacing:2px;font-weight:600;height:10px;margin-top:2px}
.kb{display:grid;grid-template-columns:repeat(3,78px);gap:24px;margin-top:14px;place-items:center}
.callb{width:78px;height:78px;border-radius:50%;background:#34c759;display:grid;place-items:center}
.dlb{font-size:26px;color:var(--sub)}
.dav{width:110px;height:110px;border-radius:50%;background:linear-gradient(#a8aab5,#7b7d89);color:#fff;font-size:46px;display:grid;place-items:center;margin:6px auto 10px}
.dnm{text-align:center;font-size:28px;font-weight:600;margin-bottom:16px}
.acts{display:flex;gap:8px;padding:0 16px;margin-bottom:20px}
.acts button{flex:1;height:64px;background:var(--card);border-radius:12px;color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
.call{position:absolute;inset:0;z-index:50;background:linear-gradient(165deg,#6b7a8a,#323b46 55%,#15191e);color:#fff;display:flex;flex-direction:column;align-items:center;animation:fin .25s}
.cn{font-size:38px;font-weight:500;margin-top:112px;text-align:center}
.cs{font-size:20px;opacity:.7;margin-top:6px}
.cgrid{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,78px);gap:22px 30px}
.cb{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px}
.cb i{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;transition:.15s}
.cb.on i{background:#fff;color:#000}
.endb{position:absolute;bottom:92px;left:50%;margin-left:-39px;width:78px;height:78px;border-radius:50%;background:#ff3b30;display:grid;place-items:center}
.endb svg{transform:rotate(135deg)}
.call.end{opacity:.6;transition:.3s}

/* 채팅 (카카오톡/메시지) */
.chd{flex:none;height:48px;display:flex;align-items:center;padding:0 12px;gap:8px}
.chd.k{background:var(--kbg)}
.chd .bk{display:flex;color:var(--fg)}
.chd.i .bk{color:var(--blue)}
.cnm{font-size:17px;font-weight:700;flex:1}
.chr{display:flex;gap:16px;align-items:center;margin-left:auto}
.chd.i{justify-content:space-between;border-bottom:.5px solid var(--line);background:var(--bar);height:70px;align-items:flex-start;padding-top:2px}
.icn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.ms{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.ms::-webkit-scrollbar{display:none}
.dsep{align-self:center;font-size:12px;color:var(--sub);padding:6px 12px;margin:6px 0}
.app.kk .dsep{background:rgba(0,0,0,.22);color:#fff;border-radius:12px}
.mr{display:flex;gap:8px;align-items:flex-end}
.mr.me{justify-content:flex-end}
.mav{width:38px;height:38px;border-radius:15px;background:linear-gradient(#b7bbc6,#868b99);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;align-self:flex-start}
.mn{font-size:12px;margin-bottom:3px;color:var(--fg)}
.bwrap{display:flex;align-items:flex-end;gap:5px}
.bb{max-width:230px;padding:9px 12px;border-radius:18px;font-size:16px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.mt{font-size:10.5px;color:var(--sub);white-space:nowrap}
.app.kk .mt{color:rgba(0,0,0,.5)}
.app.kk[data-x] .mt{color:#fff}
.app.kk .you .bb{background:#fff;color:#000;border-radius:4px 14px 14px 14px}
.app.kk .me .bb{background:#fee500;color:#000;border-radius:14px 4px 14px 14px}
.app:not(.kk) .you .bb{background:#e9e9eb;color:#000}
.app:not(.kk) .me .bb{background:#0a84ff;color:#fff}
[data-theme=dark] .app:not(.kk) .you .bb{background:#26262a;color:#fff}
.app:not(.kk) .mt{display:none}
.typ{display:flex;gap:4px;padding:13px 14px}
.typ i{width:7px;height:7px;border-radius:50%;background:#999;animation:bl 1s infinite}
.typ i:nth-child(2){animation-delay:.2s}.typ i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
.cin{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 34px;background:var(--bar)}
.cin.k{background:var(--card)}
.cin input{flex:1;height:36px;border-radius:18px;padding:0 14px;font-size:16px}
.cin.k input{background:var(--fill)}

let locked=true,code='',passOn=false;

function dots(){$$('.pdots i').forEach((d,i)=>d.classList.toggle('f',i<code.length));$('#pcancel').textContent=code.length?'삭제':'취소'}
function pushKey(k){if(code.length>=4)return;$('#ptitle').textContent='암호 입력';code+=k;dots();
 if(code.length===4)setTimeout(()=>{code===PASSCODE?unlock():wrong()},180)}
function wrong(){const d=$('.pdots');d.classList.add('shake');navigator.vibrate&&navigator.vibrate(200);$('#ptitle').textContent='다시 시도하십시오';
 setTimeout(()=>{d.classList.remove('shake');code='';dots()},500)}
function showPass(){code='';dots();$('#ptitle').textContent='암호 입력';$('#pass').classList.add('show');passOn=true}
function hidePass(){$('#pass').classList.remove('show');passOn=false;code='';dots()}

$('#emg').onclick=()=>toast('데모에서는 긴급 전화를 지원하지 않아요');
function unlock(){locked=false;$('#lock').classList.add('unlocked');setSB('home');setTimeout(hidePass,600)}

const REPLY=[[/사랑|좋아해/,['나도 사랑해 ♥','나도!! 많이 사랑해 🥰']],[/보고싶|보고 싶/,['나도 보고싶어 ㅠㅠ','빨리 보자 ㅠㅠ']],[/뭐해|뭐함|모해/,['그냥 있어 ㅋㅋ 너는?','폰 보고 있었지 ㅋㅋ']],[/두쫀쿠/,['두쫀쿠 웨이팅 엄청 길대 ㅠㅠ','두쫀쿠 먹고싶다...']],[/배고|밥|먹/,['나도 배고파 ㅠㅠ 뭐 먹을까?','맛있는 거 먹으러 가자!']],[/ㅋㅋ|ㅎㅎ/,['ㅋㅋㅋㅋㅋㅋ','ㅎㅎㅎ 왜 웃어 ㅋㅋ']],[/안녕|하이/,['안녕~ ㅎㅎ','왔어? ㅎㅎ']]];
const DEF=['응응 ㅋㅋ','그래?','ㅋㅋㅋㅋ 알겠어~','오 ㅎㅎ','진짜?','헐 대박'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const tm=ts=>new Date(ts).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
function chatView(c,o){
 const k=o.kind==='kakao',msgs=state.chats[o.key],init=o.name.slice(0,1);let typing=false;
 c.classList.toggle('kk',k);c.style.background=k?'var(--kbg)':'';
 c.innerHTML=`<div class="top"></div>
 <div class="chd ${k?'k':'i'}"><button class="bk" id="bk">${svg('back',24)}</button>${k?`<b class="cnm">${esc(o.name)}</b>`:`<div class="icn"><div class="av s">${init}</div><small>${esc(o.name)} ›</small></div>`}<div class="chr">${k?svg('search',22)+'<span style="font-size:22px">☰</span>':svg('vid',28)}</div></div>
 <div class="ms" id="ms"></div>
 <div class="cin ${k?'k':'i'}"><button class="plus">${svg('plus',20)}</button><input id="ci" placeholder="${k?'':'iMessage'}" enterkeyhint="send"><button class="sd" id="sd">${svg('up',20)}</button></div>`;
 const ms=$('#ms',c),inp=$('#ci',c),sd=$('#sd',c);
 function row(m,i){let h='';
  if(i===0||new Date(msgs[i-1].ts).toDateString()!==new Date(m.ts).toDateString())h+=`<div class="dsep">${new Date(m.ts).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>`;
  if(m.me)h+=`<div class="mr me"><span class="mt">${tm(m.ts)}</span><div class="bb">${esc(m.t)}</div></div>`;
  else h+=`<div class="mr you">${k?`<div class="mav">${init}</div>`:''}<div>${k?`<div class="mn">${esc(o.name)}</div>`:''}<div class="bwrap"><div class="bb">${esc(m.t)}</div><span class="mt">${tm(m.ts)}</span></div></div></div>`;
  return h}
 function paint(){ms.innerHTML=msgs.map(row).join('')+(typing?`<div class="mr you">${k?`<div class="mav">${init}</div>`:''}<div class="bb typ"><i></i><i></i><i></i></div></div>`:'');ms.scrollTop=ms.scrollHeight}
 function send(){const v=inp.value.trim();if(!v)return;inp.value='';sd.classList.remove('on');
  msgs.push({me:true,t:v,ts:Date.now()});save();paint();typing=true;setTimeout(paint,50);
  setTimeout(()=>{typing=false;const hit=REPLY.find(r=>r[0].test(v));msgs.push({me:false,t:pick(hit?hit[1]:DEF),ts:Date.now()});save();paint()},900+Math.random()*900)}
 inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
 inp.oninput=()=>sd.classList.toggle('on',!!inp.value.trim());
 sd.onclick=send;
 $('#bk',c).onclick=()=>{c.classList.remove('kk');c.style.background='';o.back()};
 paint()}

 const fmtNum=s=>{const d=digits(s);return d.startsWith('010')&&d.length>7?d.replace(/(\d{3})(\d{4})(\d{0,4}).*/,(m,a,b,x)=>x?`${a}-${b}-${x}`:`${a}-${b}`):d};
 const when=ts=>{const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return tm(ts);if(d.toDateString()===new Date(n-864e5).toDateString())return '어제';return `${d.getMonth()+1}. ${d.getDate()}.`};
 const cho='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',base={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
 const initial=n=>{const ch=n.trim()[0]||'#',cd=ch.charCodeAt(0);if(cd>=0xAC00&&cd<=0xD7A3){const x=cho[Math.floor((cd-0xAC00)/588)];return base[x]||x}return /[a-z]/i.test(ch)?ch.toUpperCase():'#'};
 const TABS=[['fav','즐겨찾기','star'],['rec','최근 기록','clock'],['con','연락처','person'],['pad','키패드','pad'],['vm','음성 사서함','vm']];
 const bar=()=>`<div class="tabs">${TABS.map(t=>`<div class="tab ${tab===t[0]?'on':''}" data-t="${t[0]}">${svg(t[2],26)}<span>${t[1]}</span></div>`).join('')}</div>`;

 function favHtml(){const f=state.contacts.filter(x=>x.fav);
  return `<div class="nav"><button class="blue">편집</button><button class="blue" id="addf">${svg('plus',26)}</button></div><div class="lt">즐겨찾기</div>
  <div class="sc"><div class="lst">${f.map(x=>`<div class="lr" data-call="${x.id}"><span class="nm">${esc(x.name)}</span><span class="sub">휴대전화</span><span class="blue" style="font-size:22px" data-info="${x.id}">ⓘ</span></div>`).join('')||'<div class="noev">즐겨찾기가 없습니다</div>'}</div></div>`}
 function recHtml(){const r=state.recents.filter(x=>filter==='all'||x.kind==='missed');
  return `<div class="nav"><button class="blue">편집</button><div class="seg"><b class="${filter==='all'?'on':''}" data-f="all">전체</b><b class="${filter==='missed'?'on':''}" data-f="missed">부재중</b></div><span style="width:34px"></span></div><div class="lt">최근 기록</div>
  <div class="sc"><div class="lst">${r.map((x,i)=>`<div class="lr" data-ri="${state.recents.indexOf(x)}"><div style="flex:1"><div style="font-size:17px;${x.kind==='missed'?'color:#ff3b30':''}">${esc(x.name||fmtNum(x.phone))}</div><div class="sub" style="font-size:13px">${x.kind==='out'?'발신 전화':x.kind==='missed'?'부재중 전화':'수신 전화'}</div></div><span class="sub" style="font-size:14px">${when(x.ts)}</span><span class="blue" style="font-size:22px">ⓘ</span></div>`).join('')||'<div class="noev">최근 기록 없음</div>'}</div></div>`}
 function conHtml(){const list=[...state.contacts].sort((a,b)=>a.name.localeCompare(b.name,'ko'));let last='',h='';
  list.forEach(x=>{const s=initial(x.name);if(s!==last){h+=`<div class="sech">${s}</div>`;last=s}h+=`<div class="lr" data-c="${x.id}"><span class="nm" style="font-weight:500">${esc(x.name)}</span></div>`});
  return `<div class="nav"><button class="blue">그룹</button><button class="blue" id="addc">${svg('plus',26)}</button></div><div class="lt">연락처</div>
  <div class="sc"><div class="search">${svg('search',16)} 검색</div><div style="display:flex;align-items:center;gap:12px;padding:6px 20px 12px;border-bottom:.5px solid var(--line)"><div class="av" style="width:56px;height:56px;font-size:24px">나</div><div><b style="font-size:20px;font-weight:600">${MY_NAME}</b><div class="sub" style="font-size:13px">내 카드</div></div></div><div class="lst" style="padding-left:20px">${h}</div></div>`}
 function padHtml(){const K2=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
  return `<div class="padwrap"><div class="numd">${fmtNum(num)||'&nbsp;'}</div><div class="addn">${num?'번호 추가':'&nbsp;'}</div>
  <div class="keys">${K2.map(k=>`<button class="k" data-k="${k[0]}"><span style="${k[0]==='*'?'font-size:44px;margin-top:8px':''}">${k[0]}</span><small>${k[1]}</small></button>`).join('')}</div>
  <div class="kb"><span></span><button class="callb" id="cb">${svg('phone',36,'#fff')}</button>${num?`<button class="dlb" id="dl">⌫</button>`:'<span></span>'}</div></div>`}
 function vmHtml(){return `<div class="nav"><span></span><span></span></div><div class="lt">음성 사서함</div><div class="sc"><div class="noev" style="padding-top:140px;font-size:20px">음성 사서함 없음</div></div>`}
 function detHtml(){
  if(edit){const x=det.isNew?{name:'',phone:'',speed:0}:det;
   return `<div class="nav"><button class="blue" id="cx">취소</button><button class="blue b" id="ok">완료</button></div><div class="sc"><div class="dav">${esc((x.name||'?')[0])}</div>
   <div class="grp"><div class="rw"><input id="en" placeholder="이름" value="${esc(x.name)}"></div><div class="rw"><input id="ep" type="tel" inputmode="tel" placeholder="전화번호" value="${esc(x.phone)}"></div>
   <div class="rw"><span class="g">단축번호</span><select id="es" style="color:var(--blue)"><option value="0">없음</option>${[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}" ${x.speed===n?'selected':''}>${n}번</option>`).join('')}</select></div>
   <div class="rw"><span class="g">즐겨찾기</span><div class="sw ${x.fav?'on':''}" id="ef"></div></div></div></div>`}
  return `<div class="nav"><button class="blue" id="bk">${svg('back',22)}연락처</button><button class="blue" id="ed">편집</button></div><div class="sc"><div class="dav">${esc(det.name[0]||'?')}</div><div class="dnm">${esc(det.name)}</div>
   <div class="acts"><button id="am">${svg('bubble',22)}메시지</button><button id="ac">${svg('phone',22)}통화</button><button id="av2">${svg('vid',22)}영상 통화</button><button id="amail">${svg('mail',22)}메일</button></div>
   <div class="grp"><div class="rw col"><span class="sub" style="font-size:13px">휴대전화</span><span class="blue">${esc(det.phone)}</span></div></div>

   <div class="grp"><button class="rw red" id="rm">연락처 삭제</button></div></div>`}

 function draw(){
  let body;if(det)body=detHtml();else body={fav:favHtml,rec:recHtml,con:conHtml,pad:padHtml,vm:vmHtml}[tab]();
  c.innerHTML=`<div class="top"></div>${body}${edit?'':bar()}`;bind()}
 function bind(){
  $$('.tab',c).forEach(t=>t.onclick=()=>{tab=t.dataset.t;det=null;edit=false;draw()});
  $$('[data-call]',c).forEach(r=>r.onclick=e=>{const x=state.contacts.find(y=>y.id==r.dataset.call);if(e.target.dataset.info){det=x;draw()}else startCall(x.name,x.phone)});
  $$('[data-f]',c).forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});
  $$('[data-ri]',c).forEach(r=>r.onclick=()=>{const x=state.recents[r.dataset.ri];startCall(x.name||fmtNum(x.phone),x.phone)});
  $$('[data-c]',c).forEach(r=>r.onclick=()=>{det=state.contacts.find(y=>y.id==r.dataset.c);draw()});
  const nc=()=>{det={isNew:true,name:'',phone:'',speed:0};edit=true;draw()};
  if($('#addc',c))$('#addc',c).onclick=nc;if($('#addf',c))$('#addf',c).onclick=nc;
  $$('.k',c).forEach(b=>{const k=b.dataset.k,stop=()=>clearTimeout(lpT);
   b.onpointerdown=()=>{if(k==='1'){lpFired=false;lpT=setTimeout(()=>{lpFired=true;speed(1)},650)}};
   b.onpointerup=stop;b.onpointerleave=stop;b.onpointercancel=stop;
   b.onclick=()=>{if(lpFired){lpFired=false;return}num+=k;draw()}});
  if($('#dl',c))$('#dl',c).onclick=()=>{num=num.slice(0,-1);draw()};
  if($('#cb',c))$('#cb',c).onclick=()=>{
   if(!num){const l=state.recents.find(r=>r.phone);if(l){num=digits(l.phone);draw()}return}
   if(num.length===1&&state.contacts.some(x=>String(x.speed)===num)){speed(+num);return}
   const f=find(num);startCall(f?f.name:fmtNum(num),fmtNum(num))};
  if(det){
   if(edit){
    $('#cx',c).onclick=()=>{if(det.isNew)det=null;edit=false;draw()};
    let fav=!!det.fav;$('#ef',c).onclick=e=>{fav=!fav;e.currentTarget.classList.toggle('on',fav)};
    $('#ok',c).onclick=()=>{const name=$('#en',c).value.trim(),phone=$('#ep',c).value.trim(),sp=+$('#es',c).value;
     if(!name){api.toast('이름을 입력해 주세요');return}
     if(sp)state.contacts.forEach(x=>{if(x.speed===sp&&x!==det)x.speed=0});
     if(det.isNew){det={id:Date.now(),name,phone,speed:sp,fav};state.contacts.push(det)}else Object.assign(det,{name,phone,speed:sp,fav});
     save();edit=false;draw()}
   }else{
    $('#bk',c).onclick=()=>{det=null;draw()};$('#ed',c).onclick=()=>{edit=true;draw()};
    $('#ac',c).onclick=()=>startCall(det.name,det.phone);
    $('#am',c).onclick=()=>api.toast('메시지 앱에서 대화할 수 있어요');
    $('#av2',c).onclick=()=>api.toast('영상 통화는 지원하지 않아요');$('#amail',c).onclick=()=>api.toast('메일은 지원하지 않아요');
    $('#rm',c).onclick=()=>{state.contacts=state.contacts.filter(x=>x!==det);save();det=null;draw()}}}}
 function speed(n){const x=state.contacts.find(y=>y.speed===n);if(x)startCall(x.name,x.phone);else api.toast(`단축번호 ${n}번이 지정되어 있지 않아요`)}
 function startCall(name,phone){
  if(callEl)return;api.sb('w');
  const B=[['소리 끔','mic'],['키패드','pad'],['오디오','spk'],['FaceTime','vid'],['추가','plus'],['연락처','person']];
  callEl=document.createElement('div');callEl.className='call';
  callEl.innerHTML=`<div class="cn">${esc(name)}</div><div class="cs">전화 거는 중...</div>
  <div class="cgrid">${B.map(b=>`<div class="cb"><i>${svg(b[1],32)}</i>${b[0]}</div>`).join('')}</div>
  <button class="endb">${svg('phone',38,'#fff')}</button>`;
  c.appendChild(callEl);
  $$('.cb',callEl).forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  const cs=$('.cs',callEl);let secs=0;

   state.recents.unshift({name,phone,kind:'out',ts:Date.now()});save();
   setTimeout(()=>{callEl&&callEl.remove();callEl=null;api.sb('auto');draw()},700)}}
 draw();
 return()=>{clearTimeout(ct);clearInterval(ci);clearTimeout(lpT)}
}};

 function chat(){state.kUnread=0;save();chatView(c,{kind:'kakao',key:'kakao',name:'규지닝',back:draw})}

APPS.naver={sb:'k',render(c,api){
 c.style.cssText+=';--bg:#fff;--fg:#111;--card:#fff;--sub:#8b95a1;--line:#eceff1;--fill:#f2f4f6;--blue:#03c75a;background:#fff';
 const NLOGO=(s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}"><rect width="24" height="24" rx="5" fill="#03c75a"/><path d="M6 5h3.4l5.2 7.2V5H18v14h-3.4L9.4 11.8V19H6z" fill="#fff"/></svg>`;
 const SH=[['메일','#03c75a','✉','https://mail.naver.com'],['카페','#26b566','☕','https://section.cafe.naver.com'],['블로그','#1ec800','b','https://section.blog.naver.com'],['쇼핑','#00bfa5','◈','https://shopping.naver.com'],['뉴스','#3b82f6','▤','https://news.naver.com'],['지도','#10b06b','⌖','https://map.naver.com'],['웹툰','#00d564','W','https://comic.naver.com'],['클립','#ff4d6d','▶','https://www.naver.com']];
 const today=()=>{const d=new Date();return pad(d.getMonth()+1)+'.'+pad(d.getDate())+'.'};
 const open=u=>window.open(u,'_blank','noopener');
 const nb=()=>`<div class="nbar"><button id="nb1">‹</button><button id="nb2" style="opacity:.35">›</button><button class="gh" id="ngh">${NLOGO(26)}</button><button id="nb4"><span style="border:2px solid #444;border-radius:5px;width:20px;height:20px;font-size:12px;display:grid;place-items:center">1</span></button><button id="nb5">≡</button></div>`;
 function home(){

 function searchView(q0=''){

 function doSearch(q){q=q.trim();if(!q)return;
  state.searches=state.searches.filter(s=>s.q!==q);state.searches.unshift({q,d:today()});state.searches=state.searches.slice(0,15);save();result(q)}
 function result(q){

APPS.calc={sb:'w',render(c){

 let cur='0',prev=null,op=null,fresh=false,opB=null;const map={'÷':'/','×':'*','−':'-','+':'+'};
 const fmt=s=>{let n=parseFloat(s);if(!isFinite(n))return '오류';if(Math.abs(n)>=1e9||(n!==0&&Math.abs(n)<1e-6))return n.toExponential(4).replace('e+','e');const[a,b]=String(s).split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b!==undefined?'.'+b:'')};
 const show=()=>{const d=$('#cd',c);d.textContent=fmt(cur);const L=d.textContent.length;d.style.fontSize=(L>9?46:L>7?58:L>6?70:84)+'px'};
 const clr=()=>{if(opB){opB.classList.remove('act');opB=null}};
 const comp=()=>{const a=prev,b=parseFloat(cur);let r=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:b===0?NaN:a/b;cur=String(+r.toPrecision(10))};

  else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.';clr()}

  APPS.naver={sb:'k',render(c,api){
   c.style.cssText+=';--bg:#fff;--fg:#111;--card:#fff;--sub:#8b95a1;--line:#eceff1;--fill:#f2f4f6;--blue:#03c75a;background:#fff';
   const NLOGO=(s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}"><rect width="24" height="24" rx="5" fill="#03c75a"/><path d="M6 5h3.4l5.2 7.2V5H18v14h-3.4L9.4 11.8V19H6z" fill="#fff"/></svg>`;
   const SH=[['메일','#03c75a','✉','https://mail.naver.com'],['카페','#26b566','☕','https://section.cafe.naver.com'],['블로그','#1ec800','b','https://section.blog.naver.com'],['쇼핑','#00bfa5','◈','https://shopping.naver.com'],['뉴스','#3b82f6','▤','https://news.naver.com'],['지도','#10b06b','⌖','https://map.naver.com'],['웹툰','#00d564','W','https://comic.naver.com'],['클립','#ff4d6d','▶','https://www.naver.com']];
   const today=()=>{const d=new Date();return pad(d.getMonth()+1)+'.'+pad(d.getDate())+'.'};
   const open=u=>window.open(u,'_blank','noopener');
   const timers=[];let run=0;
   const wait=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
   const nb=()=>`<div class="nbar"><button id="nb1">‹</button><button id="nb2" style="opacity:.35">›</button><button class="gh" id="ngh">${NLOGO(26)}</button><button id="nb4"><span style="border:2px solid #444;border-radius:5px;width:20px;height:20px;font-size:12px;display:grid;place-items:center">1</span></button><button id="nb5">≡</button></div>`;

   function home(first){run++;
    c.innerHTML=`<div class="top" style="background:#fff"></div><div class="sc" style="background:#fff;padding-bottom:10px">
    <div class="nsb" id="ns" style="transition:transform .12s">${NLOGO(26)}<span class="sp">검색어를 입력하세요</span><i>${svg('mic',22)}</i></div>
    <div class="nsc">${SH.map((s,i)=>`<div class="nsh" data-s="${i}"><i style="background:${s[1]}">${s[2]}</i>${s[0]}</div>`).join('')}</div>
    <div class="ncard"><div class="nct">내 최근 검색어</div><div class="nchips">${state.searches.slice(0,6).map(s=>`<span class="nchip" data-q="${esc(s.q)}">${esc(s.q)}</span>`).join('')||'<span class="sub">없음</span>'}</div></div>
    <div class="ncard"><div class="nct">오늘의 추천</div><div class="nimg" style="background:linear-gradient(120deg,#ffd9a8,#ffb3c1)"></div><div class="nimg" style="background:linear-gradient(120deg,#c8f0d4,#a8d8f0)"></div></div></div>${nb()}`;
    $('#ns',c).onclick=()=>searchView();
    $$('[data-s]',c).forEach(e=>e.onclick=()=>open(SH[e.dataset.s][3]));
    $$('.nchip',c).forEach(e=>e.onclick=()=>doSearch(e.dataset.q));
    ['#nb1','#nb2','#nb4','#nb5'].forEach(s=>$(s,c).onclick=()=>api.toast('데모 화면이에요'));$('#ngh',c).onclick=()=>home();
    if(first)auto()}

   function searchView(q0='',isAuto){if(!isAuto)run++;
    const hist=state.searches.map((s,i)=>`<div class="nr" data-q="${esc(s.q)}"><span class="ci">${svg('clock',18)}</span><span class="nq">${esc(s.q)}</span><span class="nd">${s.d}</span><button class="x" data-del="${i}">✕</button></div>`).join('')||'<div class="noev">최근 검색어가 없습니다.</div>';
    c.innerHTML=`<div class="top" style="background:#fff"></div><div class="nsrow"><button id="bk" style="color:#111;display:flex">${svg('back',24)}</button>
    <div class="nin"><input id="qi" value="${esc(q0)}" placeholder="검색어를 입력하세요" enterkeyhint="search"><button id="cl" style="display:${q0?'block':'none'}">✕</button></div><button class="gr" id="go">검색</button></div>
    <div class="sc" style="background:#fff"><div class="nh"><b>최근 검색어</b><button id="ca">전체삭제</button></div>${hist}</div>
    <div class="nfoot"><span>자동저장 끄기</span><span id="cx">닫기</span></div>`;
    const qi=$('#qi',c);if(isAuto)qi.readOnly=true;else qi.focus();
    qi.oninput=()=>$('#cl',c).style.display=qi.value?'block':'none';
    qi.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)doSearch(qi.value)};
    $('#cl',c).onclick=()=>{qi.value='';qi.focus();qi.oninput()};
    $('#go',c).onclick=()=>doSearch(qi.value);$('#bk',c).onclick=()=>home();$('#cx',c).onclick=()=>home();
    $('#ca',c).onclick=()=>{state.searches=[];save();searchView(qi.value)};
    $$('.nr',c).forEach(r=>r.onclick=e=>{if(e.target.dataset.del!==undefined){state.searches.splice(+e.target.dataset.del,1);save();searchView(qi.value)}else doSearch(r.dataset.q)})}

   function doSearch(q,silent){q=q.trim();if(!q)return;
    if(!silent){state.searches=state.searches.filter(s=>s.q!==q);state.searches.unshift({q,d:today()});state.searches=state.searches.slice(0,15);save()}
    result(q)}

   function result(q){run++;
    const B=q.replace(/\s*웨이팅\s*/,' ').trim()||q;
    const rel=[B+' 웨이팅',B+' 후기',B+' 메뉴',B+' 가격',B+' 주차'].filter(x=>x!==q);
    const posts=TT(B).map((t,i)=>{const b=BG[i];
     return `<div class="nbp"><div class="tx"><div class="who"><i style="background:${b[1]}"></i>${b[0]} · blog.naver.com</div><h4>${esc(t).split(esc(B)).join('<em>'+esc(B)+'</em>')}</h4><p>${SN[i]}</p><div class="dd">${AGO[i]}</div></div><div class="th" style="background:linear-gradient(135deg,${b[1]},${b[2]})"></div></div>`}).join('');
    c.innerHTML=`<div class="top" style="background:#fff"></div><div class="nsrow"><button id="bk" style="color:#111;display:flex">${svg('back',24)}</button><div class="nin" id="nq"><input value="${esc(q)}" readonly style="pointer-events:none"><button>✕</button></div></div>
    <div class="ntabs">${['통합','VIEW','이미지','지식iN','쇼핑','뉴스'].map((t,i)=>`<b class="${i?'':'on'}">${t}</b>`).join('')}</div>
    <div class="sc" style="background:#fff;padding-bottom:30px">
     <div class="nrel"><div class="nct">연관 검색어</div><div class="nchips">${rel.map(r=>`<span class="nchip" data-q="${esc(r)}">${esc(r)}</span>`).join('')}</div></div>
     <div class="nbh"><span>블로그</span><small>VIEW</small></div>${posts}
     <button class="nlink" id="rl">네이버에서 '${esc(q)}' 검색하기</button></div>`;
    $('#bk',c).onclick=()=>searchView();$('#nq',c).onclick=()=>searchView(q);
    $$('.nchip',c).forEach(e=>e.onclick=()=>doSearch(e.dataset.q));
    $$('.nbp,.ntabs b',c).forEach(e=>e.onclick=()=>api.toast('데모에서는 열 수 없어요'));
    $('#rl',c).onclick=()=>open('https://search.naver.com/search.naver?query='+encodeURIComponent(q))}

   /* 자동 재생: 검색창 터치 → 키보드로 '한정선' 입력 → 검색 결과 */
   async function auto(){
    const my=++run;const W=async ms=>{await wait(ms);if(my!==run)throw 0};
    try{
     await W(1300);
     const ns=$('#ns',c);if(ns)ns.style.transform='scale(.97)';await W(150);
     searchView('',true);
     const inp=$('#qi',c),cl=$('#cl',c),nf=$('.nfoot',c);
     const kb=makeKb();c.appendChild(kb);nf.style.paddingBottom='12px';
     await W(450);kb.style.height='284px';await W(500);kb.style.overflow='visible';await W(450);
     const shiftK=on=>{$$('.kkk[data-s]',kb).forEach(e=>e.textContent=on?e.dataset.s:e.dataset.k);$('[data-k=shift]',kb).classList.toggle('on',on)};
     const press=async(k,ms)=>{const e=$(`.kkk[data-k="${k}"]`,kb);if(!e)return;xKeyClick(k);if(e.classList.contains('l'))e.dataset.p=e.textContent;e.classList.add('pr');await W(ms);e.classList.remove('pr')};
     let done='';
     for(const ch of Q){
      for(const s of steps(ch)){
       if(s.shift){shiftK(true);await W(130)}
       await press(s.k,s.shift?95:80);
       if(s.shift)shiftK(false);
       inp.value=done+s.show;cl.style.display='block';
       await W(90+Math.random()*90)}
      done+=ch;inp.value=done}
     await W(550);await press('ret',110);await W(200);
     doSearch(Q,true)
    }catch(e){}}

   home(true);
   return()=>{run++;timers.forEach(clearTimeout)}}};

  /* ===== 이미 도착해 있는 마지막 메시지: '언니 밥 먹어써?' (대본에서는 제거) ===== */
  if(typeof SCRIPT!=='undefined'&&SCRIPT.length&&SCRIPT[0][0]===0&&SCRIPT[0][1]==='언니 밥 먹어써?')SCRIPT.shift();
  if(!state.chats.kakao.some(m=>!m.me&&m.t==='언니 밥 먹어써?'))state.chats.kakao.push({me:false,t:'언니 밥 먹어써?',ts:Date.now()});
  state.kUnread=1;

  /* ===== 잠금 해제 후 '카톡!' 알림 배너 ===== */
  function openKakaoChat(){
   if(typeof locked!=='undefined'&&locked)return;
   const go=()=>{openApp('kakao',null,{});const d=document.querySelector('#appLayer .app[data-id="kakao"]');
    if(!d)return;const t=d.querySelector('.tab[data-t="c"]');if(t)t.click();const r=d.querySelector('#c1');if(r)r.click()};
   if(curApp){closeApp();setTimeout(go,520)}else go()}
  function showBanner(){
   {const lm=state.chats.kakao[state.chats.kakao.length-1];if(lm&&!lm.me&&lm.t==='언니 밥 먹어써?')lm.ts=Date.now()}  /* 알림이 뜨는 시점 = 방금 도착한 메시지 */
   const b=document.createElement('div');b.className='nbn';
   b.innerHTML=`<div class="ni2"><svg viewBox="0 0 48 48" width="30"><ellipse cx="24" cy="22" rx="18" ry="14.5" fill="#3b1e1e"/><path d="M13 32l-3 8 10-5z" fill="#3b1e1e"/></svg></div><div class="nt2"><b>규지닝</b><p>언니 밥 먹어써?</p></div><small>지금</small>`;
   $('#screen').appendChild(b);
   requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('show')));
   xKSound();navigator.vibrate&&navigator.vibrate([60,40,60]);
   let gone=false,y0=null;
   const hide=()=>{if(gone)return;gone=true;b.classList.remove('show');setTimeout(()=>b.remove(),500)};
   const auto=setTimeout(hide,5500);
   b.onpointerdown=e=>{y0=e.clientY};
   b.onpointerup=e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;clearTimeout(auto);hide();if(dy>-20)openKakaoChat()}}
  let shown=false;const lk=$('#lock');
  new MutationObserver(()=>{if(!shown&&lk.classList.contains('unlocked')){shown=true;setTimeout(showBanner,1200)}}).observe(lk,{attributes:true,attributeFilter:['class']});
 })();
})();

/* ============ 시작 ============ */
applyState();tick();setSB('lock');
</script>
</body>
</html>
